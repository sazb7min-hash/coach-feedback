<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bench Force</title>
<meta name="theme-color" content="#ff6f1e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ef;--card:#fff;--text:#1d1b19;--muted:#7a736c;--line:#e8e2db;--o:#ff6f1e;--os:#fff0e6;--ok:#2f9e5b;--bad:#d9453b}
@media (prefers-color-scheme:dark){:root{--bg:#141210;--card:#1f1c19;--text:#f3eee9;--muted:#a39b93;--line:#2f2b27;--os:#3a2618}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,Roboto,"Segoe UI",Arial,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:19px;margin:0;font-weight:800}
header .sub{color:var(--muted);font-size:13px}
main{padding:4px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:0 1px 0 var(--line)}
.lbl{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:6px}
.big{font-size:34px;font-weight:800;line-height:1.1}
.big small{font-size:15px;color:var(--muted);font-weight:600;margin-left:4px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.btn{border:0;border-radius:14px;background:var(--o);color:#fff;font:700 16px/1 inherit;padding:15px;width:100%;cursor:pointer}
.btn.sec{background:var(--line);color:var(--text)}
.btn:disabled{opacity:.4}
.mini{border:0;border-radius:10px;background:var(--os);color:var(--o);font:700 14px/1 inherit;padding:9px 12px;cursor:pointer}
input,select{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font:600 17px/1 inherit;background:transparent;color:var(--text)}
input:focus{outline:none;border-color:var(--o)}
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .w{font-weight:800;font-size:20px;min-width:92px}
.set .r{color:var(--muted)}
.set.warm .w{font-size:16px;font-weight:600;color:var(--muted)}
.chk{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:transparent;cursor:pointer;flex:none}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.plates{font-size:12px;color:var(--muted)}
.warn{background:#fde8e6;color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:800;margin-top:10px}
@media (prefers-color-scheme:dark){.warn{background:#3a1c1a}}
.tip{background:var(--os);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.weeks .wk{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:stretch;margin-bottom:8px}
.weeks .wn{font-weight:800;color:var(--muted);font-size:13px;display:flex;align-items:center}
.sess{background:var(--card);border-radius:12px;padding:9px 10px;font-size:14px;border:2px solid transparent;cursor:pointer}
.sess b{display:block;font-size:15px}
.sess.done{opacity:.55}
.sess.cur{border-color:var(--o)}
.sess.test b{color:var(--bad)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font:600 12px/1.2 inherit;color:var(--muted);cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--o)}
nav i{font-style:normal}
.timer{position:fixed;left:16px;right:16px;bottom:78px;max-width:528px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:9}
.timer .t{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.timer button{border:0;background:var(--o);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
svg text{fill:var(--muted);font-size:11px}
h2{font-size:22px;margin:6px 0 12px}
.hb{margin-left:auto;border:0;background:var(--card);color:var(--text);width:42px;height:42px;border-radius:12px;font-size:20px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.txt p{margin:0 0 10px}
.trow{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow input{padding:9px;text-align:center}
.nw{font-size:13px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><div><h1>Bench Force</h1><div class="sub" id="hsub"></div></div><button class="hb" id="menuBtn" aria-label="menu">☰</button></header>
<main id="app"></main>
<div class="timer" id="timer"><div><div class="muted" style="color:inherit;opacity:.7;font-size:12px" id="trest"></div><div class="t" id="tt">0:00</div></div><div class="sp"></div><button id="tplus"></button><button id="tstop"></button></div>
<nav id="nav">
  <button data-v="today"><span>🏋️</span><i data-t="nav_today"></i></button>
  <button data-v="plan"><span>📅</span><i data-t="nav_plan"></i></button>
  <button data-v="progress"><span>📈</span><i data-t="nav_progress"></i></button>
  <button data-v="settings"><span>⚙️</span><i data-t="nav_settings"></i></button>
</nav>
<script src="i18n.js"></script>
<script>
// ===== Bench Force v0.3 — формулы из таблицы «Bench Press Force 1.0» (цикл 2) =====
const KEY='bf_v1';
let S; try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
if(!S) S={settings:{bar:20},cycles:[],cur:-1};
const ALLP=[0.1,0.2,0.25,0.5,1,1.25,2.5,5,10,15,20,25];
if(!S.settings.plates) S.settings.plates=[1.25,2.5,5,10,15,20,25];
if(!S.settings.lang){ const nl=(navigator.language||'ru').slice(0,2).toLowerCase(); S.settings.lang = LANGS[nl]? nl : (nl==='be'||nl==='kk'?'ru':'en'); }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(k,v)=>{ let s=(I18N[S.settings.lang]||I18N.ru)[k]; if(s==null) s=I18N.ru[k]??k; if(v) for(const x in v) s=s.split('{'+x+'}').join(v[x]); return s; };
const DOT=()=>['en','zh'].includes(S.settings.lang);
const fmt=w=>{ const s=(+(+w).toFixed(2)).toString(); return DOT()? s : s.replace('.',','); };
const num=v=>parseFloat(String(v).replace(',','.'));

// ===== блины: достижимые веса (шаг 0,05 кг на сторону) =====
const U=20; let PC=null;
function plateTable(){
  const key=JSON.stringify([S.settings.bar,S.settings.plates]); if(PC&&PC.key===key) return PC;
  const ps=(S.settings.plates||[]).map(p=>Math.round(p*U)).filter(p=>p>0).sort((a,b)=>b-a);
  const MAX=U*200, best=new Array(MAX+1).fill(null); best[0]=[];
  for(let x=1;x<=MAX;x++){ for(const p of ps){ if(p<=x&&best[x-p]&&(!best[x]||best[x-p].length+1<best[x].length)) best[x]=best[x-p].concat([p/U]); } }
  return PC={key,best};
}
const rnd=w=>{ const bar=S.settings.bar||20; if(w<=bar) return bar;
  const {best}=plateTable(), tg=Math.round((w-bar)/2*U);
  // ближайший вес, но без «горы» мелких блинов: каждый блин на сторону = штраф 0,05 кг
  let bx=-1, bs=1e9;
  for(let x=Math.max(0,tg-3*U); x<=Math.min(best.length-1,tg+3*U); x++){ if(!best[x]) continue;
    const sc=Math.abs(x-tg)*2/U + 0.05*best[x].length; if(sc<bs-1e-9){ bs=sc; bx=x; } }
  if(bx<0){ for(let d=0; d<best.length; d++){ for(const x of [tg-d,tg+d]){ if(x>=0&&x<best.length&&best[x]) return +(bar+2*x/U).toFixed(2); } } return bar; }
  return +(bar+2*bx/U).toFixed(2); };
function plates(w){ const bar=S.settings.bar||20, x=Math.round((w-bar)/2*U); if(x<=0) return t('empty_bar');
  const pl=plateTable().best[x]; if(!pl) return '';
  return t('per_side')+' '+pl.slice().sort((a,b)=>b-a).map(fmt).join(' + '); }

// ===== расчёт: 1ПМ пересчитывается по тестам «вес × максимум» (пт 3, 6, 9 недели) =====
// по умолчанию (пока тест не введён) — значения из таблицы: 15, 10, 6 повт.
const TESTS={3:{min:10,top:20,plan:15,a:4,b:6},6:{min:8,top:16,plan:10,a:7,b:9},9:{min:5,top:10,plan:6,a:10,b:10}};
function rms(c){
  const R0=c.rm, r=c.res||{};
  const e3=r.f3??TESTS[3].plan, e6=r.f6??TESTS[6].plan, e9=r.f9??TESTS[9].plan;
  const R1=(e3>10? R0+(e3-10)*0.011*R0 : R0)*0.9;   // H9
  const R2= e6>8 ? R1+(e6-8)*0.01*R1 : R1;           // H15
  const R3= e9>5 ? R2+(e9-5)*0.01*R2 : R2;           // H21
  return {R0,R1,R2,R3, est1:r.f3==null, est2:r.f6==null, est3:r.f9==null};
}
function plan(c){
  const {R0,R1,R2,R3}=rms(c);
  const W=(k,R,sets,reps)=>({kind:'work',w:rnd(k*R),sets,reps,k});
  const T=(n)=>({kind:'test',n});
  const M=(k,R,wk)=>({kind:'max',w:rnd(k*R),wk,k,...TESTS[wk]});
  return [
    [W(.8,R0,6,3), W(.54,R0,5,10)],
    [W(.85,R0,4,3), W(.6075,R0,3,10)],
    [T(3), M(.675,R0,3)],
    [W(.85,R1,6,2), W(.65,R1,5,8)],
    [W(.9,R1,4,2), W(.725,R1,3,8)],
    [T(2), M(.8,R1,6)],
    [W(.9,R2,7,1), W(.7,R2,6,5)],
    [W(.925,R2,5,1), W(.775,R2,4,5)],
    [T(1), M(.85,R2,9)],
    [{kind:'rest'}, W(.6,R3,5,5)],
  ];
}
const sid=(w,d)=>`${w}${d?'b':'a'}`;
function nextSession(c){ for(let w=0;w<10;w++) for(let d=0;d<2;d++){ if(w===9&&d===0) continue; if(!(c.done||{})[sid(w,d)]) return [w,d]; } return null; }
function warmup(W,heavy){
  const bar=S.settings.bar||20, out=[[bar,heavy?10:15]];
  const steps=heavy? [[.4,8],[.55,5],[.7,3],[.8,2],[.9,1]] : [[.45,8],[.6,5],[.75,3]];
  for(const [k,r] of steps){ const w=rnd(W*k); if(w>bar && w<W && !out.some(x=>x[0]===w)) out.push([w,r]); }
  return out;
}
const r1=v=>fmt(Math.round(v*10)/10);
// краткие веса недель, на которые влияет тест wk
function affected(c,wk){
  const p=plan(c), T=TESTS[wk], lines=[];
  for(let w=T.a-1; w<=T.b-1; w++){ const parts=p[w].filter(s=>s.kind==='work'||s.kind==='max').map(s=>s.kind==='work'?`${fmt(s.w)}×${s.sets}×${s.reps}`:`${fmt(s.w)}×max`); if(parts.length) lines.push(`${t('wk',{n:w+1})}: ${parts.join(' · ')}`); }
  return lines.join('<br>');
}
function testRow(c,wk,onch){
  const T=TESTS[wk], r=rms(c), R={3:r.R1,6:r.R2,9:r.R3}[wk], s=plan(c)[wk-1][1], v=c.res['f'+wk];
  const row=el('div','trow');
  const info=el('div','',`<b>${t('wk',{n:wk})} · ${fmt(s.w)} ${t('kg')} × max</b> <span class="muted">(${T.min}–${T.top})</span><div class="nw">${wk===9?t('aff9'):t('aff',{a:T.a,b:T.b})} · ${t('est_rm',{v:r1(R)})}${v==null?'<br>'+t('not_entered',{n:T.plan}):''}</div>`);
  const i=el('input'); i.type='number'; i.inputMode='numeric'; i.placeholder=t('reps_ph'); i.value=v??'';
  i.onchange=()=>{ const n=parseInt(i.value); c.res['f'+wk]=isNaN(n)?undefined:n; save(); onch(); };
  row.append(info,i); return row;
}
function testsCard(c,onch){
  const cd=el('div','card'); cd.append(el('div','lbl',t('tests')), el('div','muted',t('tests_hint')));
  [3,6,9].forEach(wk=>cd.append(testRow(c,wk,onch))); return cd;
}

// ===== UI =====
let view='today', openS=null;
function go(v){ view=v; openS=null; render(); window.scrollTo(0,0); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#menuBtn').onclick=()=>go(view==='about'?'today':'about');
function applyStatic(){
  document.documentElement.lang=S.settings.lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#trest').textContent=t('rest'); $('#tplus').textContent=t('plus30'); $('#tstop').textContent=t('stop');
  $('#menuBtn').setAttribute('aria-label',t('menu'));
}
function render(){
  applyStatic();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const app=$('#app'); app.innerHTML='';
  const c=S.cycles[S.cur];
  $('#hsub').textContent = c ? t('cyc_sub',{n:S.cur+1,rm:fmt(c.rm)}) : t('sub');
  if(view==='about'){ app.append(about()); return; }
  if(!c && view!=='settings'){ app.append(onboarding()); return; }
  if(view==='today'){ const n=openS||nextSession(c); app.append(n? session(c,n[0],n[1]) : finished(c)); }
  if(view==='plan') app.append(planView(c));
  if(view==='progress') app.append(progress());
  if(view==='settings') app.append(settings());
}
function langCard(){
  const c=el('div','card'); c.append(el('div','lbl','🌐 '+t('language')));
  const sel=el('select'); for(const k in LANGS){ const o=el('option','',LANGS[k]); o.value=k; if(k===S.settings.lang) o.selected=true; sel.append(o); }
  sel.onchange=()=>{ S.settings.lang=sel.value; save(); render(); };
  c.append(sel); return c;
}
function about(){
  const d=el('div'); d.append(el('h2','',t('about')));
  d.append(el('div','card txt',t('about_html')));
  d.append(el('h2','',t('howto')));
  d.append(el('div','card txt',t('howto_html')));
  d.append(langCard());
  const b=el('button','btn sec',t('close')); b.onclick=()=>go('today'); d.append(b);
  d.append(el('div','muted',`<br>${t('version')}`));
  return d;
}
function onboarding(suggest){
  const d=el('div');
  d.append(el('h2','', suggest?t('new_cycle'):t('start')));
  const cd=el('div','card');
  cd.append(el('div','lbl',t('rm_label')));
  const i=el('input'); i.type='number'; i.inputMode='decimal'; i.value=suggest||100;
  cd.append(i, el('div','muted', '<br>'+t('rm_hint')));
  const b=el('button','btn',t('calc')); b.style.marginTop='14px';
  b.onclick=()=>{ const v=num(i.value); if(!(v>=20&&v<=400)){ i.focus(); return; }
    S.cycles.push({rm:v,start:Date.now(),res:{},done:{}}); S.cur=S.cycles.length-1; save(); go('today'); };
  cd.append(b); d.append(cd);
  d.append(platesCard(()=>pv()));
  const prev=el('div','card'); d.append(prev);
  const pv=()=>{ const v=num(i.value); prev.innerHTML='';
    prev.append(el('div','lbl',t('preview')));
    if(!(v>=20&&v<=400)){ prev.append(el('div','muted',t('preview_bad'))); return; }
    prev.append(previewTable({rm:v,res:{},done:{}})); };
  i.oninput=pv; pv();
  if(!suggest) d.append(langCard());
  return d;
}
function previewTable(c){
  const p=plan(c), tb=el('div','weeks');
  const pct=k=>Math.round(k*100)+'%';
  p.forEach((wk,w)=>{ const row=el('div','wk'); row.append(el('div','wn',t('wk',{n:w+1})));
    wk.forEach(s=>{ let h;
      if(s.kind==='rest') h=`<b>${t('rest')}</b>`;
      else if(s.kind==='work') h=`<b>${fmt(s.w)} ${t('kg')}</b>${s.sets} × ${s.reps} · ${pct(s.k)}`;
      else if(s.kind==='test') h=`<b>${t('go_n',{n:s.n})}</b>${t('test')}`;
      else h=`<b>${fmt(s.w)} ${t('kg')}</b>${t('x_max',{min:s.min,top:s.top})}`;
      row.append(el('div','sess'+(s.kind==='test'||s.kind==='max'?' test':''),h)); });
    tb.append(row); });
  tb.append(el('div','muted',t('preview_note')));
  return tb;
}
function platesCard(onch){
  const c=el('div','card'); c.append(el('div','lbl',t('gym')));
  const b=el('input'); b.type='number'; b.inputMode='decimal'; b.value=S.settings.bar;
  b.onchange=()=>{ S.settings.bar=num(b.value)||20; save(); onch&&onch(); };
  c.append(el('div','muted',t('bar')), b);
  const h=el('div','muted',t('plates_hint')); h.style.marginTop='12px'; c.append(h);
  const ch=el('div','chips');
  ALLP.forEach(p=>{ const on=S.settings.plates.includes(p); const x=el('button','mini',(on?'✓ ':'')+fmt(p)+' '+t('kg'));
    if(!on){ x.style.background='var(--line)'; x.style.color='var(--muted)'; }
    x.onclick=()=>{ const L=S.settings.plates; const k=L.indexOf(p); if(k>=0){ if(L.length>1) L.splice(k,1); } else L.push(p); save(); c.replaceWith(platesCard(onch)); onch&&onch(); };
    ch.append(x); });
  c.append(ch);
  return c;
}
function session(c,w,d){
  const s=plan(c)[w][d], key=sid(w,d), box=el('div');
  const r=rms(c);
  box.append(el('h2','',t('title',{w:w+1,d:d?2:1})));
  if(s.kind==='rest'){ box.append(el('div','card',t('rest_day'))); return box; }
  const cd=el('div','card');
  const done=c.done[key];
  if(s.kind==='work'){
    cd.append(el('div','lbl',t('work_sets')));
    cd.append(el('div','big',`${fmt(s.w)}<small>${t('kg')} × ${s.sets} × ${s.reps}</small>`));
    cd.append(el('div','plates',plates(s.w)));
    if(w===9) cd.append(el('div','tip',t('deload')));
    const est = (w>=3&&w<6&&r.est1)||(w>=6&&w<9&&r.est2)||(w===9&&r.est3);
    if(est) cd.append(el('div','tip',t('prelim')));
    box.append(cd);
    const wc=el('div','card'); wc.append(el('div','lbl',t('warmup')));
    warmup(s.w, s.reps<=3).forEach(([kg,reps])=>wc.append(setRow(kg,reps,true)));
    { const h=el('div','lbl',t('work')); h.style.marginTop='10px'; wc.append(h); }
    const st=c.sets?.[key]||[];
    for(let i=0;i<s.sets;i++){ const row=setRow(s.w,s.reps,false,st[i]); row.querySelector('.chk').onclick=e=>{ c.sets=c.sets||{}; c.sets[key]=c.sets[key]||[]; c.sets[key][i]=!c.sets[key][i]; e.currentTarget.classList.toggle('on'); save(); if(c.sets[key][i]) startTimer(s.reps<=3?180:120); }; wc.append(row); }
    box.append(wc);
  }
  if(s.kind==='test'){
    const est=s.n===3?r.R0:s.n===2?r.R1:r.R2;
    const k={3:.9,2:.95,1:1}[s.n];
    cd.append(el('div','lbl',t('test_n',{n:s.n})));
    cd.append(el('div','big',`≈ ${fmt(rnd(est*k))}<small>${t('approx',{n:s.n})}</small>`));
    cd.append(el('div','warn',t('spot')));
    cd.append(el('div','tip',t('test_tip')));
    box.append(cd);
    const wc=el('div','card'); wc.append(el('div','lbl',t('warmup')));
    warmup(rnd(est*k),true).forEach(([kg,reps])=>wc.append(setRow(kg,reps,true)));
    box.append(wc);
    const rc=el('div','card'); rc.append(el('div','lbl',t('best',{n:s.n})));
    const i=el('input'); i.type='number'; i.inputMode='decimal'; i.value=c.res['t'+(w+1)]??''; rc.append(i);
    i.onchange=()=>{ const v=num(i.value); c.res['t'+(w+1)]=isNaN(v)?undefined:v; save(); };
    box.append(rc);
  }
  if(s.kind==='max'){
    cd.append(el('div','lbl',t('test_max')));
    cd.append(el('div','big',`${fmt(s.w)}<small>${t('kg_max')}</small>`));
    cd.append(el('div','plates',plates(s.w)));
    cd.append(el('div','tip',t('max_tip',{min:s.min,top:s.top})));
    box.append(cd);
    const wc=el('div','card'); wc.append(el('div','lbl',t('warmup')));
    warmup(s.w,false).forEach(([kg,reps])=>wc.append(setRow(kg,reps,true)));
    box.append(wc);
    const rc=el('div','card'); rc.append(el('div','lbl',t('reps_q')));
    const i=el('input'); i.type='number'; i.inputMode='numeric'; i.value=c.res['f'+s.wk]??''; rc.append(i);
    const out=el('div','tip'); rc.append(out);
    const upd=()=>{ const v=parseInt(i.value); c.res['f'+s.wk]=isNaN(v)?undefined:v; save(); const R=rms(c); const nv={3:R.R1,6:R.R2,9:R.R3}[s.wk];
      out.innerHTML = (isNaN(v)? t('recalc_wait') : t('recalc_done',{v:r1(nv)})) + `<div class="nw"><b>${t('new_w')}</b><br>${affected(c,s.wk)}</div>`; };
    i.oninput=upd; upd(); box.append(rc);
  }
  const b=el('button','btn', done?t('undo'):t('done'));
  if(done) b.classList.add('sec');
  b.onclick=()=>{ c.done[key]=!done; save(); openS=null; render(); window.scrollTo(0,0); };
  box.append(b);
  const nt=el('div','card'); nt.style.marginTop='12px'; nt.append(el('div','lbl',t('note')));
  const ta=el('input'); ta.placeholder=t('note_ph'); ta.value=(c.notes||{})[key]||''; ta.style.fontWeight='400';
  ta.onchange=()=>{ c.notes=c.notes||{}; c.notes[key]=ta.value; save(); }; nt.append(ta); box.append(nt);
  return box;
}
function setRow(kg,reps,warm,on){
  const r=el('div','set'+(warm?' warm':''));
  r.append(el('div','w',`${fmt(kg)} ${t('kg')}`), el('div','r',`× ${reps}`));
  if(!warm){ const k=el('div','chk'+(on?' on':''),'✓'); r.append(k); }
  return r;
}
function planView(c){
  const box=el('div'); box.append(el('h2','',t('cycle',{n:S.cur+1})));
  const p=plan(c), n=nextSession(c)||[];
  const g=el('div','weeks');
  p.forEach((wk,w)=>{ const row=el('div','wk'); row.append(el('div','wn',t('wk',{n:w+1})));
    wk.forEach((s,d)=>{ const k=sid(w,d); let tt,sub;
      if(s.kind==='rest'){ tt=t('rest'); sub=''; }
      else if(s.kind==='work'){ tt=`${fmt(s.w)} ${t('kg')}`; sub=`${s.sets} × ${s.reps}`; }
      else if(s.kind==='test'){ tt=t('go_n',{n:s.n}); sub=c.res['t'+(w+1)]?t('result',{v:fmt(c.res['t'+(w+1)])}):t('test'); }
      else { tt=`${fmt(s.w)} ${t('kg')}`; sub=c.res['f'+s.wk]!=null?t('x_reps',{v:c.res['f'+s.wk]}):t('x_max',{min:s.min,top:s.top}); }
      const b=el('div','sess'+(c.done[k]?' done':'')+(n[0]===w&&n[1]===d?' cur':'')+(s.kind!=='work'&&s.kind!=='rest'?' test':''),`<b>${tt}</b>${sub}`);
      if(s.kind!=='rest') b.onclick=()=>{ view='today'; openS=[w,d]; render(); window.scrollTo(0,0); };
      row.append(b); });
    g.append(row); });
  box.append(g);
  box.append(testsCard(c,()=>{ const y=window.scrollY; render(); window.scrollTo(0,y); }));
  return box;
}
function finished(c){
  const r=rms(c), t1=c.res.t9;
  const sug=Math.round(r.R3*2)/2;   // следующий цикл — от расчётного 1ПМ 9-й недели (H21)
  const d=el('div'); d.append(el('h2','',t('fin')));
  d.append(el('div','card',`<div class="lbl">${t('summary')}</div><div class="big">${fmt(sug)}<small>${t('next_rm')}</small></div><div class="muted">${t('fin_line',{a:fmt(c.rm),t:t1?t('t1',{v:fmt(t1)}):'',c:r1(r.R3)})}</div>`));
  d.append(onboarding(sug));
  return d;
}
function progress(){
  const d=el('div'); d.append(el('h2','',t('progress')));
  if(!S.cycles.length){ d.append(el('div','card',t('nodata'))); return d; }
  const pts=[]; S.cycles.forEach((c,i)=>{ const r=rms(c); pts.push([`C${i+1} ${t('p_start')}`,c.rm]); if(c.res.f3!=null) pts.push([t('p_w')+'3',r.R1/0.9]); if(c.res.f6!=null) pts.push([t('p_w')+'6',r.R2]); if(c.res.f9!=null) pts.push([t('p_w')+'9',r.R3]); if(c.res.t9) pts.push([t('rm'),c.res.t9]); });
  const W=340,H=170,P=28, ys=pts.map(p=>p[1]), mn=Math.min(...ys)*0.97, mx=Math.max(...ys)*1.03||1;
  const X=i=>P+(pts.length<2?0:(W-2*P)*i/(pts.length-1)), Y=v=>H-P-(H-2*P)*(v-mn)/((mx-mn)||1);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#ff6f1e" stroke-width="3" points="${pts.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>`;
  pts.forEach((p,i)=>{ svg+=`<circle cx="${X(i)}" cy="${Y(p[1])}" r="4" fill="#ff6f1e"/><text x="${X(i)}" y="${Y(p[1])-9}" text-anchor="middle">${Math.round(p[1])}</text><text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p[0])}</text>`; });
  svg+='</svg>';
  d.append(el('div','card',`<div class="lbl">${t('rm_kg')}</div>`+svg));
  S.cycles.slice().reverse().forEach((c,j)=>{ const i=S.cycles.length-1-j, dn=Object.values(c.done||{}).filter(Boolean).length;
    d.append(el('div','card',`<div class="row"><b>${t('cycle',{n:i+1})}</b><div class="sp"></div><span class="muted">${new Date(c.start).toLocaleDateString(S.settings.lang)}</span></div><div class="muted">${t('cyc_line',{rm:fmt(c.rm),d:dn})}${c.res.t3?` · 3RM ${fmt(c.res.t3)}`:''}${c.res.t6?` · 2RM ${fmt(c.res.t6)}`:''}${c.res.t9?` · 1RM ${fmt(c.res.t9)}`:''}</div>`)); });
  return d;
}
function settings(){
  const d=el('div'); d.append(el('h2','',t('settings')));
  d.append(langCard());
  d.append(platesCard(()=>{}));
  const c=S.cycles[S.cur];
  if(c){ const cc=el('div','card'); cc.append(el('div','lbl',t('cur_cycle')));
    const i=el('input'); i.type='number'; i.value=c.rm; i.onchange=()=>{ const v=num(i.value); if(v>=20){ c.rm=v; save(); render(); } };
    cc.append(el('div','muted',t('rm_start')), i);
    const nb=el('button','btn sec',t('new_btn')); nb.style.marginTop='12px'; nb.onclick=()=>{ S.cur=-1; save(); view='today'; render(); };
    cc.append(nb); d.append(cc); }
  const bk=el('div','card'); bk.append(el('div','lbl',t('backup')));
  bk.append(el('div','muted',t('backup_hint')));
  const ex=el('button','mini',t('save_copy')); ex.onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})); a.download='bench-force-backup.json'; a.click(); };
  const im=el('button','mini',t('load_copy')); const f=el('input'); f.type='file'; f.accept='.json,application/json'; f.style.display='none';
  im.onclick=()=>f.click(); f.onchange=async()=>{ try{ const tx=await f.files[0].text(); const v=JSON.parse(tx); if(v&&v.cycles){ S=v; if(!S.settings.plates) S.settings.plates=[1.25,2.5,5,10,15,20,25]; save(); go('today'); } }catch(e){ alert(t('bad_file')); } };
  const ch=el('div','chips'); ch.append(ex,im,f); bk.append(ch); d.append(bk);
  const ab=el('button','btn sec','ℹ️ '+t('about')+' · '+t('howto')); ab.onclick=()=>go('about'); d.append(ab);
  d.append(el('div','muted',`<br>${t('version')}`));
  return d;
}
// ===== таймер отдыха =====
let tEnd=0,tInt=null;
function startTimer(sec){ tEnd=Date.now()+sec*1000; $('#timer').style.display='flex'; clearInterval(tInt); tick(); tInt=setInterval(tick,250); }
function tick(){ const left=Math.max(0,Math.round((tEnd-Date.now())/1000)); $('#tt').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  if(left<=0){ clearInterval(tInt); try{ navigator.vibrate&&navigator.vibrate([300,150,300]); }catch(e){} try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(); o.frequency.value=880; o.connect(a.destination); o.start(); setTimeout(()=>{o.stop();a.close();},500);}catch(e){} setTimeout(()=>$('#timer').style.display='none',3000); } }
$('#tplus').onclick=()=>{ tEnd+=30000; tick(); };
$('#tstop').onclick=()=>{ clearInterval(tInt); $('#timer').style.display='none'; };
save(); render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
