<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Церебро</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rasp:#B5124F; --rasp-2:#D81B60; --rasp-soft:#FCE6EE; --rasp-line:#F5C2D4;
  --gold:#F4B400; --gold-2:#FFC93C; --gold-soft:#FFF5D6; --gold-ink:#7A5600;
  --black:#111114; --white:#FFFFFF; --green:#11935A; --green-soft:#E3F5EC;
  --bg:#F7F5F6; --text:#111114; --muted:#6F6A70; --line:#ECE6E9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Manrope,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 110px}
.hdr{background:linear-gradient(135deg,var(--rasp) 0%,var(--rasp-2) 100%);color:#fff;padding:16px 16px 20px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.hdr::after{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,201,60,.35),rgba(255,201,60,0) 70%)}
.hdr-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.logo{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.logo svg{width:28px;height:28px}
.hdr h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.hdr .sub{opacity:.85;font-size:13.5px}
.back{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
h2{font-size:20px;margin:18px 0 10px;font-weight:800;letter-spacing:-.2px}
h3{font-size:15px;margin:18px 0 8px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:#fff;border-radius:18px;padding:14px 16px;margin:0 0 12px;box-shadow:0 1px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15.5px;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)} .btn:disabled{opacity:.45}
.b-rasp{background:var(--rasp);color:#fff} .b-gold{background:var(--gold);color:var(--black)} .b-black{background:var(--black);color:#fff}
.b-ghost{background:var(--rasp-soft);color:var(--rasp)} .b-light{background:#fff;color:var(--black);box-shadow:inset 0 0 0 1.5px var(--line)}
.full{width:100%}
.row{display:flex;gap:10px;align-items:center} .row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;outline:none;font-size:16px;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--rasp)}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--rasp-soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px 4px;font-weight:800;font-size:13.5px;color:var(--rasp);cursor:pointer}
.seg button.on{background:var(--rasp);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}
.chips button.on{background:var(--black);border-color:var(--black);color:#fff}
.chips.g button.on{background:var(--gold);border-color:var(--gold);color:var(--black)}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.list .nm{flex:1;min-width:0}
.list .nm b{display:block;font-weight:700} .list .nm span{font-size:13.5px;color:var(--muted)}
.tap{cursor:pointer}
.ib{border:0;background:var(--bg);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;flex:none;display:grid;place-items:center}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.p-r{background:var(--rasp-soft);color:var(--rasp)} .p-g{background:var(--green-soft);color:var(--green)} .p-y{background:var(--gold-soft);color:var(--gold-ink)} .p-k{background:#EEE;color:#444}
.plus{border:0;background:var(--gold);color:var(--black);font-weight:800;font-size:17px;border-radius:14px;min-width:58px;height:46px;cursor:pointer;flex:none;box-shadow:0 2px 0 #C99400}
.plus:active{transform:translateY(2px);box-shadow:none}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
.toast{width:max-content;max-width:min(92vw,440px);opacity:0;pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,200%);background:var(--black);color:#fff;padding:12px 14px 12px 16px;border-radius:14px;font-weight:700;z-index:99;transition:transform .25s,opacity .25s;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast span{flex:1;min-width:0}.toast button{flex:none}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto} .toast.red{background:var(--rasp)}
.toast button{border:0;background:var(--gold);color:var(--black);font-weight:800;border-radius:10px;padding:7px 12px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(17,17,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:90}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:92vh;overflow:auto}
.sheet h2{margin-top:4px}
.spin{width:30px;height:30px;border:3px solid var(--rasp-soft);border-top-color:var(--rasp);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(8px)}
.tabs-in{max-width:640px;margin:0 auto;display:flex}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:12px}
.tabs button .e{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
.tabs.many button{font-size:9.5px;padding:6px 0;letter-spacing:-.2px}.tabs.many button .e{font-size:19px}
.tabs button.on{color:var(--rasp)} .tabs button.on .e{filter:none;opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--rasp);color:#fff;font-size:30px;font-weight:600;box-shadow:0 8px 20px rgba(181,18,79,.35);cursor:pointer;z-index:25}
.hero{background:var(--black);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(216,27,96,.55),rgba(216,27,96,0) 70%)}
.hero .lbl{font-size:13px;opacity:.7;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.hero .val{font-size:34px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
.hero .val.debt{color:var(--gold-2)} .hero .val.ok{color:#7CF0B5}
.hero .sub{opacity:.75;font-size:14px}
.stat{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1}
.stat div{flex:1;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px} .stat span{font-size:12.5px;opacity:.7}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid #C9C1C5;display:grid;place-items:center;flex:none;cursor:pointer;background:#fff}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on::after{content:"";width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.done .nm b{text-decoration:line-through;color:var(--muted)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--rasp-soft)}
.ico.g{background:var(--gold-soft)} .ico.k{background:#EEE}
.day{font-weight:800;font-size:14px;margin:16px 2px 6px;color:var(--rasp)}
.copy{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;word-break:break-all}
.note{white-space:pre-wrap}
.slot{display:flex;gap:8px;align-items:center;margin-top:8px}
.slot select,.slot input{flex:1}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:#fff;border-radius:18px;padding:16px;margin:0 0 10px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.tile b{display:block;font-size:16px} .tile span{color:var(--muted);font-size:13.5px} .tile .chev{margin-left:auto;color:var(--muted);font-size:22px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{display:none} .sw i{position:absolute;inset:0;background:#D9D2D6;border-radius:999px;transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--rasp)} .sw input:checked+i::after{left:23px}
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-h div{font-size:12px;font-weight:700;color:var(--muted);padding:2px 0}
.cal-d{border:0;background:var(--bg);border-radius:10px;padding:6px 0 4px;min-height:46px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-weight:700;font-size:14px}
.cal-d i{display:flex;gap:2px;height:7px}.cal-d i b{width:6px;height:6px;border-radius:50%;display:block}
.cal-d.tod{box-shadow:inset 0 0 0 2px var(--gold)}.cal-d.sel{background:var(--rasp);color:#fff}.cal-d.sel i b{outline:1.5px solid #fff}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
// ================= Налаштування =================
const API_URL = new URLSearchParams(location.search).get('api') || 'https://script.google.com/macros/s/AKfycby1kB5XF7n552WGkGfQx39MBiGlesGinFluzb0hfDzYq9dXkRkvgYJ1x3eIsT8ueu8c/exec';
const BOT = 'cerebro_130_bot';
const APP_SHORT = 'app';
const PRICE_DEFAULT = 300;

const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#B5124F'); tg.setBackgroundColor('#F7F5F6'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
const initData = tg ? tg.initData : '';
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('tgWebAppStartParam') || new URLSearchParams(location.search).get('start') || '';
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const haptic = (t='light') => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const notifyH = (t='success') => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const LOGO = `<svg viewBox="0 0 32 32" fill="none"><path d="M16 5c-2.2 0-4 1.3-4.7 3.1C9 8.3 7 10.3 7 12.8c0 .9.2 1.7.6 2.4C6.6 16 6 17.2 6 18.6c0 2.2 1.6 4 3.7 4.3.5 2.3 2.6 4.1 5.1 4.1h1.2V5Z" fill="#B5124F"/><path d="M16 5c2.2 0 4 1.3 4.7 3.1 2.3.2 4.3 2.2 4.3 4.7 0 .9-.2 1.7-.6 2.4 1 .8 1.6 2 1.6 3.4 0 2.2-1.6 4-3.7 4.3-.5 2.3-2.6 4.1-5.1 4.1H16V5Z" fill="#111114"/><path d="M12 13.5c1.2 0 2 .8 2 2M11 19c1.5-.2 2.6.6 3 2M20 13.5c-1.2 0-2 .8-2 2M21 19c-1.5-.2-2.6.6-3 2" stroke="#FFC93C" stroke-width="1.6" stroke-linecap="round"/></svg>`;

async function api(action, data = {}) {
  let last;
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, initData, ...data }) });
      const j = await r.json();
      if (!j.ok) { if (j.busy && i < 2) { await new Promise(r => setTimeout(r, 1200)); last = new Error(j.error); continue; } throw new Error(j.error || 'Помилка'); }
      return j;
    } catch (e) { last = e; if (String(e.message).match(/Failed to fetch|NetworkError|Load failed/) && i < 2) { await new Promise(r => setTimeout(r, 1500)); continue; } throw e; }
  }
  throw last;
}

// ---------- дрібниці ----------
let toastT;
function toast(msg, opt = {}) {
  const t = document.getElementById('toast');
  t.className = 'toast on' + (opt.red ? ' red' : '');
  t.innerHTML = `<span>${esc(msg)}</span>` + (opt.action ? `<button id="tAct">${esc(opt.action)}</button>` : '');
  if (opt.action) document.getElementById('tAct').onclick = () => { t.className = 'toast'; opt.onAction(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', opt.ms || (opt.action ? 6000 : 2600));
}
const fail = e => { notifyH('error'); toast(e.message || String(e), { red: true }); };
function openSheet(html) { document.getElementById('toast').className = 'toast'; document.getElementById('sheet').innerHTML = html; document.getElementById('modal').classList.add('on'); }
function closeSheet() { document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); });
function ask(text, okLabel = 'Так', danger = true) {
  return new Promise(res => {
    openSheet(`<h2>${esc(text)}</h2><div class="row" style="margin-top:18px"><button class="btn b-light" id="aNo">Скасувати</button><button class="btn ${danger ? 'b-rasp' : 'b-gold'}" id="aYes">${esc(okLabel)}</button></div>`);
    document.getElementById('aNo').onclick = () => { closeSheet(); res(false); };
    document.getElementById('aYes').onclick = () => { closeSheet(); res(true); };
  });
}
const pad = n => String(n).padStart(2, '0');
const DOW = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const DOWF = ['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
const MON = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MONN = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const hm = ms => { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dShort = ms => { const d = new Date(ms); return d.getDate() + ' ' + MON[d.getMonth()]; };
function dayKey(ms) { const d = new Date(ms); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function dayLabel(ms) {
  const k = dayKey(ms), now = Date.now();
  if (k === dayKey(now)) return 'Сьогодні';
  if (k === dayKey(now + 864e5)) return 'Завтра';
  if (k === dayKey(now - 864e5)) return 'Вчора';
  const d = new Date(ms); return DOWF[d.getDay()][0].toUpperCase() + DOWF[d.getDay()].slice(1) + ', ' + dShort(ms);
}
const when = ms => dayLabel(ms) + ', ' + hm(ms);
const dateVal = ms => { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const toMs = (d, t) => d ? new Date(d + 'T' + (t || '09:00')).getTime() : null;
function plural(n, a, b, c) { n = Math.abs(n); if (n % 1) return b; n %= 100; const d = n % 10; if (n > 10 && n < 20) return c; if (d === 1) return a; if (d >= 2 && d <= 4) return b; return c; }
const fmtN = n => String(Math.round(n * 100) / 100).replace('.', ',');
const lessonsW = n => fmtN(n) + ' ' + plural(n, 'урок', 'уроки', 'уроків');
const money = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' грн';
function balPill(b) {
  if (b.balance < 0) return `<span class="pill p-r">До сплати ${money(b.debt)}</span>`;
  if (b.balance > 0) return `<span class="pill p-g">Оплачено ще ${lessonsW(b.balance)}</span>`;
  return `<span class="pill p-k">Баланс 0</span>`;
}
function balHero(b, name) {
  let val, cls = '', sub;
  if (b.balance < 0) { val = 'До сплати ' + money(b.debt); cls = 'debt'; sub = lessonsW(-b.balance) + ' проведено без оплати'; }
  else if (b.balance > 0) { val = 'Оплачено ще ' + lessonsW(b.balance); cls = 'ok'; sub = 'Ці уроки вже оплачені наперед'; }
  else { val = 'Боргу немає'; sub = 'Оплачених наперед уроків теж немає'; }
  return `<div class="hero"><div class="lbl">${esc(name || 'Баланс')}</div><div class="val ${cls}">${val}</div><div class="sub">${sub}</div>
    <div class="stat"><div><b>${b.held}</b><span>проведено</span></div><div><b>${fmtN(b.paidLessons)}</b><span>оплачено уроків</span></div><div><b>${money(b.price)}</b><span>за урок</span></div></div></div>`;
}
function inviteLink(kind, code) { return `https://t.me/${BOT}/${APP_SHORT}?startapp=${kind}_${code}`; }
function shareLink(url, text) {
  const u = 'https://t.me/share/url?url=' + encodeURIComponent(url) + '&text=' + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, '_blank');
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Скопійовано'); } catch (e) { prompt('Скопіюй:', text); } }

// ---------- стан ----------
const ST = { role: null, member: null, members: [], tab: 'home', items: [], clients: [] };
const CATS = { home: '🏠 Дім', personal: '👤 Особисте', work: '💼 Робота', money: '💳 Фінанси', other: '📌 Інше' };
const REP = { '': 'Один раз', day: 'Щодня', weekdays: 'Будні', week: 'Щотижня', month: 'Щомісяця', year: 'Щороку' };

function header(title, sub, back) {
  return `<div class="hdr"><div class="hdr-in">${back ? `<button class="back" id="bk">←</button>` : `<div class="logo">${LOGO}</div>`}
    <div style="min-width:0"><h1>${esc(title)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div></div>`;
}
function bindBack(fn) { const b = document.getElementById('bk'); if (b) b.onclick = fn; try { tg.BackButton.offClick(window.__bb); window.__bb = fn; if (fn) { tg.BackButton.show(); tg.BackButton.onClick(fn); } else tg.BackButton.hide(); } catch (e) {} }
function tabsBar() {
  const T = [['home','🏡','Головна'],['notes','📝','Записи'],['tasks','✅','Справи']];
  if (ST.role === 'admin') T.push(['eng','🎓','Англійська']);
  if (myTrain()) T.push(['train','🏋️','Тренування']);
  T.push(['extra','📚','Заняття']);
  if (ST.role === 'admin') T.push(['more','⚙️','Ще']);
  return `<div class="tabs${T.length > 5 ? ' many' : ''}"><div class="tabs-in">${T.map(t => `<button data-tab="${t[0]}" class="${ST.tab === t[0] ? 'on' : ''}"><span class="e">${t[1]}</span>${t[2]}</button>`).join('')}</div></div>`;
}
function bindTabs() { document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { haptic(); ST.tab = b.dataset.tab; window.scrollTo(0, 0); renderTab(); }); }
function shell(inner, opt = {}) {
  $app.innerHTML = header(opt.title || 'Церебро', opt.sub, opt.back) + `<div class="wrap">${inner}</div>` + (opt.noTabs ? '' : tabsBar()) + (opt.fab ? `<button class="fab" id="fab">+</button>` : '');
  bindBack(opt.back || null); if (!opt.noTabs) bindTabs();
  if (opt.fab) document.getElementById('fab').onclick = opt.fab;
}
const loading = (t, opt = {}) => shell('<div class="spin"></div>', { title: t, ...opt });

// ================= ЗАПУСК =================
async function boot() {
  $app.innerHTML = header('Церебро', 'Завантаження…') + '<div class="spin"></div>';
  if (!API_URL || API_URL.startsWith('__')) { $app.innerHTML = header('Церебро', 'Налаштування') + `<div class="wrap"><div class="card">Сервер ще не підключено.</div></div>`; return; }
  try {
    const r = await api('me', { start: startParam });
    ST.role = r.role;
    if (r.role === 'client') { askWrite(); return clientHome(r.me); }
    if (r.role === 'anon') return anon(r.name);
    ST.member = r.member; ST.members = r.members || [];
    askWrite(); renderTab();
  } catch (e) {
    $app.innerHTML = header('Церебро', 'Помилка') + `<div class="wrap"><div class="card">${esc(e.message)}</div><button class="btn b-rasp full" onclick="boot()">Спробувати ще раз</button></div>`;
  }
}
function askWrite() {
  try { if (!tg || localStorage.getItem('cer_wa')) return; tg.requestWriteAccess && tg.requestWriteAccess(ok => { if (ok) localStorage.setItem('cer_wa', '1'); }); } catch (e) {}
}
function anon(name) {
  shell(`<div class="card" style="text-align:center;padding:28px 18px"><div style="font-size:52px">🧠</div><h2>Вітаю${name ? ', ' + esc(name) : ''}!</h2>
    <p class="muted">Це приватний застосунок. Щоб увійти, відкрий посилання-запрошення, яке тобі надіслали.</p></div>`, { noTabs: true, sub: 'Немає доступу' });
}
function renderTab() {
  const t = ST.tab;
  if (t === 'home') return homeTab();
  if (t === 'notes') return itemsTab('note');
  if (t === 'tasks') return itemsTab('task');
  if (t === 'eng') return engTab();
  if (t === 'more') return moreTab();
  if (t === 'train') return trainTab();
  if (t === 'extra') return extraTab();
}
const myTrain = () => (ST.member && ST.member.opts && ST.member.opts.train) || '';

// ================= ГОЛОВНА =================
async function homeTab() {
  const now = new Date(), sub = DOWF[now.getDay()][0].toUpperCase() + DOWF[now.getDay()].slice(1) + ', ' + dShort(now.getTime());
  loading('Привіт, ' + (ST.member.name || '').split(' ')[0] + '!', { sub });
  try {
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const reqs = [api('items.list')];
    if (ST.role === 'admin') reqs.push(api('schedule', { from: d0.getTime(), to: d0.getTime() + 864e5 }), api('pending'));
    const [it, sch, pen] = await Promise.all(reqs);
    ST.items = it.items;
    const end = d0.getTime() + 864e5;
    const todayItems = it.items.filter(x => !x.done && x.at && x.at < end).sort((a, b) => a.at - b.at);
    const myTasks = it.items.filter(x => x.kind === 'task' && !x.done && (x.who.includes(ST.member.id) || x.who.includes('all') || (!x.who.length && x.author === ST.member.id)));
    let h = '';
    if (pen && pen.lessons.length) {
      h += `<h3>Підтверди уроки</h3><div class="card list">${pen.lessons.map(l => `<div class="it"><div class="ico g">🎓</div><div class="nm"><b>${esc(l.client)}</b><span>${when(l.at)}</span></div>
        <button class="ib" data-pc="${l.id}" title="Скасовано">✕</button><button class="plus" data-pd="${l.id}">✓</button></div>`).join('')}</div>`;
    }
    if (sch) {
      const ls = sch.lessons.filter(l => l.status !== 'cancelled');
      h += `<h3>Уроки сьогодні</h3>` + (ls.length ? `<div class="card list">${ls.map(l => `<div class="it"><div class="ico">${l.status === 'done' ? '✅' : '🕒'}</div><div class="nm"><b>${esc(l.client)}</b><span>${hm(l.at)}${l.status === 'done' ? ' · проведено' : ''}</span></div>${l.status === 'planned' ? `<button class="plus" data-pd="${l.id}">+1</button>` : ''}</div>`).join('')}</div>` : `<div class="card muted small">Сьогодні уроків за розкладом немає.</div>`);
    }
    try {
      const ex = await api('extras.list', { from: d0.getTime(), to: end });
      if (ex.lessons.length) h += `<h3>Заняття сьогодні</h3><div class="card list">${ex.lessons.map(l => `<div class="it"><div class="ico" style="background:${subjColor(l.subject)}22">📚</div><div class="nm"><b>${hm(l.at)} · ${esc(l.subject)}</b><span>${esc(memberName(l.who))} · ${l.dur} хв</span></div></div>`).join('')}</div>`;
      if (myTrain()) { const tr = await api('trainings.list'); const act = tr.trainings.filter(t => t.status !== 'done');
        if (act.length) h += `<h3>Тренування</h3><div class="card list">${act.slice(0, 3).map(trRow).join('')}</div>`; }
    } catch (e) {}
    h += `<h3>Нагадування на сьогодні</h3>` + (todayItems.length ? `<div class="card list">${todayItems.map(itemRow).join('')}</div>` : `<div class="card muted small">Нічого не заплановано 🎉</div>`);
    if (myTasks.length) h += `<h3>Мої справи</h3><div class="card list">${myTasks.slice(0, 8).map(itemRow).join('')}</div>`;
    h += `<div class="grid2" style="margin-top:14px"><button class="btn b-gold" id="qn">＋ Запис</button><button class="btn b-black" id="qt">＋ Справа</button></div>`;
    shell(h, { title: 'Привіт, ' + (ST.member.name || '').split(' ')[0] + '!', sub });
    document.getElementById('qn').onclick = () => itemForm({ kind: 'note' });
    document.getElementById('qt').onclick = () => itemForm({ kind: 'task' });
    bindItems(); bindTr();
    document.querySelectorAll('[data-pd]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('lesson.status', { id: b.dataset.pd, status: 'done' }); notifyH(); toast('Урок зараховано ✅'); homeTab(); } catch (e) { fail(e); b.disabled = false; } });
    document.querySelectorAll('[data-pc]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('lesson.status', { id: b.dataset.pc, status: 'cancelled' }); toast('Позначено як скасований'); homeTab(); } catch (e) { fail(e); b.disabled = false; } });
  } catch (e) { fail(e); }
}

// ================= ЗАПИСИ / СПРАВИ =================
function memberName(id) { if (id === 'all') return 'Усім'; const m = ST.members.find(x => x.id === id); return m ? m.name : '—'; }
function itemRow(x) {
  const meta = [];
  if (x.at) meta.push((x.at < Date.now() && !x.done ? '⚠️ ' : '🔔 ') + when(x.at) + (x.repeat ? ' · ' + REP[x.repeat].toLowerCase() : ''));
  if (x.kind === 'task' && x.who.length) meta.push('👤 ' + x.who.map(memberName).join(', '));
  if (x.cat && CATS[x.cat]) meta.push(CATS[x.cat]);
  return `<div class="it ${x.done ? 'done' : ''}">${x.kind === 'task' ? `<div class="chk ${x.done ? 'on' : ''}" data-done="${x.id}"></div>` : `<div class="ico ${x.at ? 'g' : 'k'}">${x.at ? '🔔' : '📝'}</div>`}
    <div class="nm tap" data-open="${x.id}"><b>${esc(x.title)}</b>${x.text ? `<span>${esc(x.text.slice(0, 80))}</span><br>` : ''}<span>${meta.join(' · ')}</span></div></div>`;
}
function bindItems() {
  document.querySelectorAll('[data-done]').forEach(el => el.onclick = async () => {
    const x = ST.items.find(i => i.id === el.dataset.done); if (!x) return;
    haptic(); el.classList.toggle('on');
    try { const r = await api('item.done', { id: x.id, done: !x.done }); if (r.moved) toast('Виконано! Наступний раз: ' + when(r.moved)); else toast(!x.done ? 'Виконано ✔️' : 'Повернуто в роботу'); notifyH(); renderTab(); }
    catch (e) { fail(e); el.classList.toggle('on'); }
  });
  document.querySelectorAll('[data-open]').forEach(el => el.onclick = () => { const x = ST.items.find(i => i.id === el.dataset.open); if (x) itemForm(x); });
}
let itemFilter = { note: 'all', task: 'mine' };
async function itemsTab(kind) {
  const title = kind === 'note' ? 'Записи і нагадування' : 'Домашні справи';
  loading(title);
  try {
    const r = await api('items.list'); ST.items = r.items;
    let list = r.items.filter(x => x.kind === kind);
    const f = itemFilter[kind];
    let segs;
    if (kind === 'note') {
      segs = [['all', 'Усі'], ['remind', 'З нагадуванням'], ['done', 'Архів']];
      if (f === 'all') list = list.filter(x => !x.done); else if (f === 'remind') list = list.filter(x => !x.done && x.at); else list = list.filter(x => x.done);
    } else {
      segs = [['mine', 'Мої'], ['all', 'Усі'], ['done', 'Виконані']];
      const mine = x => x.who.includes(ST.member.id) || x.who.includes('all') || (!x.who.length && x.author === ST.member.id);
      if (f === 'mine') list = list.filter(x => !x.done && mine(x)); else if (f === 'all') list = list.filter(x => !x.done); else list = list.filter(x => x.done);
    }
    list.sort((a, b) => (a.at || 9e15) - (b.at || 9e15) || b.created - a.created);
    if (f === 'done') list.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    const h = `<div class="seg" style="margin-bottom:12px">${segs.map(s => `<button data-f="${s[0]}" class="${f === s[0] ? 'on' : ''}">${s[1]}</button>`).join('')}</div>` +
      (list.length ? `<div class="card list">${list.map(itemRow).join('')}</div>` : `<div class="empty">${kind === 'note' ? 'Записів поки немає.<br>Натисни «+», щоб додати.' : 'Справ немає 🎉'}</div>`);
    shell(h, { title, fab: () => itemForm({ kind }) });
    document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { itemFilter[kind] = b.dataset.f; itemsTab(kind); });
    bindItems();
  } catch (e) { fail(e); }
}
function itemForm(x) {
  const isNew = !x.id, d = { kind: 'note', cat: 'home', title: '', text: '', at: null, repeat: '', who: [], ...x };
  const st = { kind: d.kind, cat: d.cat, repeat: d.repeat || '', who: d.who.slice(), remind: !!d.at };
  const others = ST.members.filter(m => m.linked);
  const canEdit = isNew || d.author === ST.member.id || ST.role === 'admin' || d.kind === 'task';
  openSheet(`<h2>${isNew ? (st.kind === 'task' ? 'Нова справа' : 'Новий запис') : (st.kind === 'task' ? 'Справа' : 'Запис')}</h2>
    <div class="seg" id="fKind"><button data-k="note">📝 Запис</button><button data-k="task">✅ Справа</button></div>
    <label class="f">Назва</label><input type="text" id="fTitle" value="${esc(d.title)}" placeholder="Напр.: Заплатити за інтернет">
    <label class="f">Деталі</label><textarea id="fText" placeholder="Необовʼязково">${esc(d.text)}</textarea>
    <label class="f">Категорія</label><div class="chips" id="fCat">${Object.entries(CATS).map(([k, v]) => `<button data-c="${k}">${v}</button>`).join('')}</div>
    <div class="row" style="margin-top:16px"><div style="flex:1;font-weight:700">🔔 Нагадати</div><label class="sw"><input type="checkbox" id="fRem" ${st.remind ? 'checked' : ''}><i></i></label></div>
    <div id="fRemBox" style="display:${st.remind ? 'block' : 'none'}">
      <div class="grid2" style="margin-top:8px"><input type="date" id="fDate" value="${d.at ? dateVal(d.at) : dateVal(Date.now())}"><input type="time" id="fTime" value="${d.at ? hm(d.at) : hm(Date.now() + 3600e3).slice(0, 2) + ':00'}"></div>
      <label class="f">Повторювати</label><div class="chips g" id="fRep">${Object.entries(REP).map(([k, v]) => `<button data-r="${k}">${v}</button>`).join('')}</div>
    </div>
    <label class="f" id="fWhoL">Кому</label><div class="chips" id="fWho"><button data-w="">Лише мені</button>${others.filter(m => m.id !== ST.member.id).map(m => `<button data-w="${m.id}">${esc(m.name)}</button>`).join('')}<button data-w="all">Усім</button></div>
    <div class="row" style="margin-top:20px">${!isNew && canEdit ? `<button class="btn b-light" id="fDel" style="flex:0 0 auto">🗑</button>` : ''}<button class="btn b-rasp" id="fSave">${isNew ? 'Зберегти' : 'Зберегти зміни'}</button></div>`);
  const paint = () => {
    document.querySelectorAll('#fKind button').forEach(b => b.classList.toggle('on', b.dataset.k === st.kind));
    document.querySelectorAll('#fCat button').forEach(b => b.classList.toggle('on', b.dataset.c === st.cat));
    document.querySelectorAll('#fRep button').forEach(b => b.classList.toggle('on', b.dataset.r === st.repeat));
    const wl = st.who.length ? st.who : [''];
    document.querySelectorAll('#fWho button').forEach(b => b.classList.toggle('on', wl.includes(b.dataset.w)));
  };
  paint();
  document.querySelectorAll('#fKind button').forEach(b => b.onclick = () => { st.kind = b.dataset.k; paint(); });
  document.querySelectorAll('#fCat button').forEach(b => b.onclick = () => { st.cat = b.dataset.c; paint(); });
  document.querySelectorAll('#fRep button').forEach(b => b.onclick = () => { st.repeat = b.dataset.r; paint(); });
  document.querySelectorAll('#fWho button').forEach(b => b.onclick = () => {
    const w = b.dataset.w;
    if (w === '' || w === 'all') st.who = w ? ['all'] : [];
    else { st.who = st.who.filter(x => x !== 'all'); st.who = st.who.includes(w) ? st.who.filter(x => x !== w) : [...st.who, w]; }
    paint();
  });
  document.getElementById('fRem').onchange = e => { st.remind = e.target.checked; document.getElementById('fRemBox').style.display = st.remind ? 'block' : 'none'; };
  document.getElementById('fSave').onclick = async e => {
    const title = document.getElementById('fTitle').value.trim(); if (!title) return toast('Напиши назву', { red: true });
    const at = st.remind ? toMs(document.getElementById('fDate').value, document.getElementById('fTime').value) : null;
    e.target.disabled = true;
    try {
      await api('item.save', { item: { id: d.id, kind: st.kind, cat: st.cat, title, text: document.getElementById('fText').value, at, repeat: st.remind ? st.repeat : '', who: st.who } });
      closeSheet(); notifyH(); toast(at ? 'Збережено. Нагадаю ' + when(at).toLowerCase() : 'Збережено'); renderTab();
    } catch (er) { fail(er); e.target.disabled = false; }
  };
  const del = document.getElementById('fDel');
  if (del) del.onclick = async () => { if (!(await ask('Видалити «' + d.title + '»?', 'Видалити'))) return itemForm(x); try { await api('item.delete', { id: d.id }); toast('Видалено'); renderTab(); } catch (e) { fail(e); } };
}

// ================= АНГЛІЙСЬКА =================

  if (engSeg === 'report') return reportView();

}

const fmtD = d => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${+dd} ${MON[+m - 1]}`; };

}

let trSeg = 'active', TR = { trainings: [], athletes: [] };

async function trainingView(id) {

  const t = TR.trainings.find(x => x.id === id); if (!t) return back();
  const coach = TR.role === 'coach', n = t.exercises.length, k = t.exercises.filter(e => e.done).length;
  const h = `<div class="card"><div class="row"><div style="flex:1"><b style="font-size:18px">${k} з ${n} вправ</b><div class="muted small">${t.status === 'done' ? 'Виконано ✅ · в архіві' : 'Відмічай вправи після виконання'}</div></div>
      <div style="flex:0 0 64px;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--rasp) ${n ? k / n * 360 : 0}deg,var(--rasp-soft) 0);display:grid;place-items:center"><div style="width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800">${n ? Math.round(k / n * 100) : 0}%</div></div></div>
      ${t.note ? `<p class="note small" style="margin:10px 0 0">${esc(t.note)}</p>` : ''}</div>

    ${coach ? `<div class="grid2" style="margin-top:12px"><button class="btn b-light" id="tEd">✎ Редагувати</button><button class="btn b-light" id="tDl">🗑 Видалити</button></div>` : ''}`;
  shell(h, { title: 'Тренування' + (t.num ? ' №' + t.num : ''), sub: (t.date ? fmtD(t.date) : '') + (coach ? ' · ' + memberName(t.forId) : '') + (t.title ? ' · ' + t.title : ''), back });
  const toggle = async exId => {
    const e = t.exercises.find(x => x.id === exId); if (!e) return;
    haptic('medium'); e.done = !e.done; const wasDone = t.status === 'done';

function trainingForm(t) {

    <label class="f">Коментар</label><textarea id="fNt" placeholder="Розминка, поради, на що звернути увагу">${esc(t ? t.note : '')}</textarea>
    <button class="btn b-rasp full" id="fSv" style="margin-top:16px">${isNew ? 'Створити тренування' : 'Зберегти'}</button>`);

  };

  paintF(); document.querySelectorAll('#fFor button').forEach(b => b.onclick = () => { st.forId = b.dataset.f; if (isNew) document.getElementById('fNum').value = nextNum(st.forId); paintF(); });

  try {
    const s = (await api('settings.get')).settings;
    shell(`<div class="card"><label class="f" style="margin-top:0">💳 Реквізити для оплати</label><textarea id="sPay" placeholder="Напр.: Картка ПриватБанку 5168 …, Олена К.">${esc(s.payInfo)}</textarea>
        <p class="muted small" style="margin:6px 0 0">Учні бачать їх у себе і в нагадуваннях про оплату.</p></div>
      <div class="card"><label class="f" style="margin-top:0">⏰ Нагадування учню перед уроком</label>
        <div class="chips g" id="sRH">${[['0', 'Не надсилати'], ['1', 'За 1 год'], ['2', 'За 2 год'], ['3', 'За 3 год'], ['24', 'За добу']].map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div>
        <label class="f">⏰ Нагадування нам перед уроком</label>
        <div class="chips g" id="sAM">${[['0', 'Не надсилати'], ['15', 'За 15 хв'], ['30', 'За 30 хв'], ['60', 'За 1 год']].map(([v, t]) => `<button data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="card"><div class="row"><div style="flex:1"><b>Сповіщати учнів</b><div class="muted small">Про проведені уроки, оплати, скасування</div></div><label class="sw"><input type="checkbox" id="sNC" ${s.notifyClient !== '0' ? 'checked' : ''}><i></i></label></div>
        <div class="row" style="margin-top:14px"><div style="flex:1"><b>Автоматично зараховувати уроки</b><div class="muted small">Заплановані уроки за розкладом стають «проведеними» через годину після закінчення, якщо їх не скасовано</div></div><label class="sw"><input type="checkbox" id="sAD" ${s.autoDone === '1' ? 'checked' : ''}><i></i></label></div></div>
      <button class="btn b-rasp full" id="sSave">Зберегти</button>`, { title: 'Налаштування', back });
    let rh = s.remindH, am = s.adminMin;
    const paint = () => { document.querySelectorAll('#sRH button').forEach(b => b.classList.toggle('on', b.dataset.v === String(rh))); document.querySelectorAll('#sAM button').forEach(b => b.classList.toggle('on', b.dataset.v === String(am))); };
    paint();
    document.querySelectorAll('#sRH button').forEach(b => b.onclick = () => { rh = b.dataset.v; paint(); });
    document.querySelectorAll('#sAM button').forEach(b => b.onclick = () => { am = b.dataset.v; paint(); });
    document.getElementById('sSave').onclick = async e => {
      e.target.disabled = true;
      try { await api('settings.save', { settings: { payInfo: document.getElementById('sPay').value, remindH: rh, adminMin: am, notifyClient: document.getElementById('sNC').checked ? '1' : '0', autoDone: document.getElementById('sAD').checked ? '1' : '0' } }); notifyH(); toast('Збережено'); }
      catch (er) { fail(er); } e.target.disabled = false;
    };
  } catch (e) { fail(e); }
}

// ================= КЛІЄНТ (учень) =================
function clientHome(me) {
  const c = me.client, now = Date.now();
  const upcoming = me.lessons.filter(l => l.status === 'planned' && l.at > now).sort((a, b) => a.at - b.at);
  const hist = [...me.lessons.filter(l => l.status === 'done').map(l => ({ ...l, t: 'l' })), ...me.payments.map(p => ({ ...p, t: 'p' }))].sort((a, b) => b.at - a.at);
  let h = balHero(me.bal, 'Мій баланс');
  if (me.bal.balance <= 0 && me.payInfo) h += `<div class="card"><b>💳 Як оплатити</b><p class="note small" style="margin:6px 0 10px">${esc(me.payInfo)}</p><button class="btn b-gold full" id="cpy">Скопіювати реквізити</button></div>`;
  if (upcoming.length) h += `<h3>Найближчі уроки</h3><div class="card list">${upcoming.slice(0, 5).map(l => `<div class="it"><div class="ico g">🕒</div><div class="nm"><b>${when(l.at)}</b><span>${l.dur} хв</span></div></div>`).join('')}</div>`;
  h += `<h3>Історія уроків і оплат</h3>` + (hist.length ? `<div class="card list">${hist.map(x => x.t === 'p'
    ? `<div class="it"><div class="ico g">💳</div><div class="nm"><b>Оплата ${money(x.amount)}</b><span>${dShort(x.at)} · ${lessonsW(x.lessons)}</span></div></div>`
    : `<div class="it"><div class="ico">✅</div><div class="nm"><b>Урок проведено</b><span>${when(x.at)}</span></div></div>`).join('')}</div>` : `<div class="card muted small">Тут зʼявлятимуться твої уроки та оплати.</div>`);
  if (me.bal.balance > 0 && me.payInfo) h += `<details class="card"><summary style="font-weight:700;cursor:pointer">💳 Реквізити для оплати</summary><p class="note small">${esc(me.payInfo)}</p></details>`;
  shell(h, { title: c.name, sub: 'Уроки англійської · ' + money(c.price) + ' за урок', noTabs: true });
  const b = document.getElementById('cpy'); if (b) b.onclick = () => copy(me.payInfo);
}

boot();
</script>
